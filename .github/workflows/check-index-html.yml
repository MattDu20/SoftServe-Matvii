name: Check index.html

on:
  workflow_dispatch:

jobs:
  check-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run check_index.sh
        id: check
        run: |
          chmod +x check_index.sh
          if ./check_index.sh; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update README on main
        if: steps.check.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to main
          git checkout main

          # Append result line only if it doesn't already exist for this branch
          ENTRY="- Branch \`${BRANCH}\`: index.html exists ✅"
          if ! grep -qF "${ENTRY}" README.md; then
            echo "${ENTRY}" >> README.md
            git add README.md
            git commit -m "chore: add index.html check result for branch ${BRANCH}"
            git push origin main
          else
            echo "Entry for branch ${BRANCH} already exists in README.md, skipping."
          fi
